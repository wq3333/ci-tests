name: CI/CD

on: [push]

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish src/server/Fullstack.Server -c Release -o publish/server

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: publish/server

  desktop:
    name: Desktop (${{ matrix.rid }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: |
          dotnet publish src/clients/desktop/Fullstack.Desktop \
            -c Release \
            -o publish/desktop \
            -r ${{ matrix.rid }} \
            --self-contained true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: publish/desktop

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: |
          cd src/clients/web
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/clients/web/dist

  mobile-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web
        run: |
          cd src/clients/web
          npm install
          npm run build

      - name: Sync Capacitor
        run: |
          cd src/clients/mobile
          npm install
          npx cap sync

      - name: Build Android APK
        run: |
          cd src/clients/mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: src/clients/mobile/android/app/build/outputs/apk/debug/*.apk

  mobile-ios:
    name: Mobile (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build web
        run: |
          cd src/clients/web
          npm install
          npm run build

      - name: Sync Capacitor
        run: |
          cd src/clients/mobile
          npm install
          npx cap sync

      - name: Build iOS app
        run: |
          cd src/clients/mobile/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: src/clients/mobile/ios/App/build/Build/Products/Debug-iphonesimulator/*.app
